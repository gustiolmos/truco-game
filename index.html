<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Truco a esa mierd#!</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<canvas id="fx"></canvas>
<!-- calor: el borde de la pantalla se prende fuego con el reloj en rojo -->
<div class="heat" id="heat" aria-hidden="true"></div>

<div id="stage">
  <header class="hud">
    <button class="menu-btn" id="menu-btn" type="button">☰</button>

    <!-- franja de la corrida: sólo aparece jugando el modo libre -->
    <div class="run-hud" id="run-hud" hidden>
      <span class="run-chip" id="run-ante"></span>
      <span class="run-chip" id="run-goal"></span>
      <span class="run-chip" id="run-hands"></span>
      <span class="run-chip run-money" id="run-money"></span>
    </div>

    <!-- modificadores equipados: a la vista durante toda la mano -->
    <div class="mods-hud" id="mods-hud" hidden></div>

    <div class="vitals" id="vitals">
      <div class="vital vital-left" id="vital-human">
        <div class="vital-tag">
          <span class="who" id="who-you">Vos</span>
          <span class="num" id="num-human">15</span>
        </div>
        <div class="vital-bar">
          <i class="vital-chip"></i>
          <i class="vital-fill"></i>
          <span class="vital-ticks" aria-hidden="true"></span>
        </div>
      </div>

      <div class="round-info">
        <div class="pot" id="pot">1 punto en juego</div>
        <div class="tricks" id="tricks"></div>
        <div class="log" id="log"></div>
      </div>

      <div class="vital vital-right" id="vital-cpu">
        <div class="vital-bar">
          <i class="vital-chip"></i>
          <i class="vital-fill"></i>
          <span class="vital-ticks" aria-hidden="true"></span>
        </div>
        <div class="vital-tag">
          <span class="num" id="num-cpu">15</span>
          <span class="who" id="who-rival">Rival</span>
        </div>
      </div>
    </div>

  </header>

  <section class="hand hand-cpu" id="hand-cpu"></section>
  <section class="table" id="table">
    <div class="slot" id="slot-cpu"></div>
    <div class="slot" id="slot-human"></div>
  </section>
  <section class="hand-row">
    <div class="envido" id="envido" title="Tus puntos de envido, ya sumados">
      <span class="who" id="who-envido">Envido</span>
      <span class="envido-num" id="envido-num">0</span>
    </div>
    <div class="hand hand-human" id="hand-human"></div>
  </section>

  <button class="deck" id="deck" type="button">
    <span class="deck-pile" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="deck-label" id="deck-label"></span>
  </button>

  <!-- reloj del turno: sólo aparece cuando está encendido y te toca -->
  <div class="turn-timer" id="turn-timer" hidden>
    <i class="turn-timer-fill" id="turn-timer-fill"></i>
    <i class="turn-timer-flame" aria-hidden="true"></i>
    <span class="turn-timer-num" id="turn-timer-num"></span>
  </div>

  <footer class="actions" id="actions"></footer>
</div>

<div class="overlay" id="menu" hidden>
  <div class="overlay-card menu-card">
    <h1 id="menu-title"></h1>

    <div class="setting">
      <span class="setting-label" id="label-points"></span>
      <div class="seg" id="target-menu" data-variant="seg"></div>
    </div>

    <div class="setting">
      <span class="setting-label" id="label-sound"></span>
      <button class="toggle" id="menu-sound" type="button" aria-pressed="true"></button>
    </div>

    <div class="setting">
      <span class="setting-label" id="label-volume"></span>
      <input class="slider" id="menu-volume" type="range" min="0" max="100" step="5">
    </div>

    <div class="setting">
      <span class="setting-label" id="label-effects"></span>
      <button class="toggle" id="menu-effects" type="button" aria-pressed="true"></button>
    </div>

    <div class="setting">
      <span class="setting-label" id="label-timer"></span>
      <button class="toggle" id="menu-timer" type="button" aria-pressed="true"></button>
    </div>

    <div class="setting">
      <span class="setting-label" id="label-language"></span>
      <div class="langs" id="langs-menu"></div>
    </div>

    <div class="menu-actions">
      <button class="good" id="menu-resume" type="button"></button>
      <button class="bad" id="menu-quit" type="button"></button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <!-- portada, y también el cartel de fin de partida -->
  <div class="overlay-card home-card" id="screen-title">
    <!-- la partida de muestra es el escenario: ocupa la pantalla entera y
         todo lo demás va encima -->
    <div class="home-demo" id="home-demo" aria-hidden="true">
      <div class="hand hand-cpu" id="demo-hand-cpu"></div>
      <div class="home-demo-table">
        <div class="slot" id="demo-slot-cpu"></div>
        <div class="slot" id="demo-slot-human"></div>
      </div>
      <div class="hand hand-human" id="demo-hand-human"></div>
      <span class="demo-shout" id="demo-shout" hidden></span>
    </div>

    <!-- la banda del menú, sobre el escenario -->
    <div class="home-main">
      <div class="home-brand">
        <h1 class="home-title" id="home-title"></h1>
        <p class="home-tagline" id="home-tagline"></p>
      </div>

      <nav class="home-actions">
        <!-- continuar sólo aparece si hay una corrida guardada a medio jugar -->
        <button class="home-link" id="home-continue" type="button" hidden></button>
        <button class="home-link" id="home-new" type="button"></button>
        <button class="home-link" id="home-settings" type="button"></button>
        <button class="home-link" id="home-share" type="button"></button>
      </nav>
    </div>

    <!-- idioma y redes, abajo a la derecha de la pantalla -->
    <div class="home-footer">
      <div class="langs" id="langs-overlay"></div>
      <div class="socials">
        <button class="social is-soon" id="social-instagram" type="button">IG</button>
        <button class="social is-soon" id="social-facebook" type="button">FB</button>
        <a class="social" id="social-github"
           href="https://github.com/gustiolmos/truco-game"
           target="_blank" rel="noopener">GH</a>
      </div>
    </div>
  </div>

  <!-- fin de partida del truco clásico -->
  <div class="overlay-card" id="screen-gameover" hidden>
    <h1 id="gameover-title"></h1>
    <p id="gameover-text"></p>
    <button id="gameover-btn"></button>
    <button class="ghost" id="gameover-quit" type="button"></button>
  </div>

  <!-- elección de modo -->
  <div class="overlay-card modes-card" id="screen-modes" hidden>
    <h1 id="modes-title"></h1>
    <div class="modes" id="modes"></div>
    <button class="ghost" id="modes-back" type="button"></button>
  </div>

  <!-- largo de la partida, para los modos que lo permiten -->
  <div class="overlay-card length-card" id="screen-length" hidden>
    <h1 id="length-title"></h1>
    <div class="lengths" id="target-overlay" data-variant="cards"></div>
    <div class="setting setting-timer">
      <span class="setting-label" id="label-timer-length"></span>
      <button class="toggle" id="length-timer" type="button" aria-pressed="true"></button>
    </div>
    <button class="good start" id="length-start" type="button"></button>
    <button class="ghost" id="length-back" type="button"></button>
  </div>

  <!-- antesala del ante: qué se pide en esta partida corta y con qué contás -->
  <div class="overlay-card run-card" id="screen-run" hidden>
    <h1 id="run-title"></h1>
    <p id="run-text"></p>

    <div class="run-stats">
      <div class="run-stat">
        <span class="run-stat-num" id="run-stat-goal"></span>
        <span class="run-stat-label" id="run-label-goal"></span>
      </div>
      <div class="run-stat">
        <span class="run-stat-num" id="run-stat-hands"></span>
        <span class="run-stat-label" id="run-label-hands"></span>
      </div>
      <div class="run-stat">
        <span class="run-stat-num" id="run-stat-money"></span>
        <span class="run-stat-label" id="run-label-money"></span>
      </div>
    </div>

    <span class="run-mods-label" id="run-label-mods"></span>
    <div class="run-mods" id="run-mods"></div>

    <div class="run-seed">
      <label class="run-seed-label" id="run-label-seed" for="run-seed-input"></label>
      <input class="run-seed-input" id="run-seed-input" type="text" maxlength="6"
             autocomplete="off" spellcheck="false">
    </div>

    <div class="setting setting-timer">
      <span class="setting-label" id="label-timer-run"></span>
      <button class="toggle" id="run-timer" type="button" aria-pressed="true"></button>
    </div>
    <button class="good start" id="run-start" type="button"></button>
    <button class="ghost" id="run-restart" type="button"></button>
    <button class="ghost" id="run-back" type="button"></button>
  </div>

  <!-- tienda entre antes: maqueta, todavía sin ítems -->
  <div class="overlay-card shop-card" id="screen-shop" hidden>
    <h1 id="shop-title"></h1>
    <p id="shop-text"></p>
    <div class="shop-slots" id="shop-slots"></div>
    <button class="ghost" id="shop-next" type="button"></button>
  </div>

  <!-- fin de corrida, con el resumen de lo que pasó -->
  <div class="overlay-card runover-card" id="screen-runover" hidden>
    <h1 id="runover-title"></h1>
    <p id="runover-text"></p>
    <ul class="run-summary" id="run-summary"></ul>
    <button class="good start" id="runover-again" type="button"></button>
    <button class="ghost" id="runover-back" type="button"></button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
